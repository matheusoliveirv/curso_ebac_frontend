<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link rel="shorcut icon" href="img/icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    
    <div class="container-fluid d-flex vw-100 vh-100 justify-content-center align-items-center">
        <div class="backform row d-flex align-items-center justify-content-center">
            <div class="col-6 text-center">
                <h2 class="text-light mb-5">Formulário Bootstrap</h2>
                <form>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="floatingInput" placeholder="Nome">
                        <label for="floatingInput">Nome</label>
                    </div>

                    <div class="input-group mb-3">
                        <div class="form-floating">
                          <input type="text" class="form-control" id="floatingInputGroup1" placeholder="E-mail">
                          <label for="floatingInputGroup1">Endereço de e-mail</label>
                        </div>
                        <span class="input-group-text">@email.com</span>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" name="telefone" id="telefone" class="form-control" id="floatingInput" placeholder="Telefone" onkeypress="mascara(this)" maxlength="15">
                        <label for="floatingInput">Telefone</label>
                    </div>

                    <a class="btn btn-primary btn-lg mt-2 w-100">Enviar</a>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="function.js"></script>
</body>
</html>
